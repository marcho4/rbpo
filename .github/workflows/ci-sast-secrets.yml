name: SAST & Secrets Scanning
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
concurrency:
  group: ci-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: security/semgrep/rules.yml
          generateSarif: true
        env:
          SEMGREP_RULES: security/semgrep/rules.yml

      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

      - name: Save SARIF to EVIDENCE
        if: always()
        run: |
          mkdir -p EVIDENCE/P10
          cp semgrep.sarif EVIDENCE/P10/semgrep.sarif || echo "No SARIF file generated"

  gitleaks:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.json
          retention-days: 30

      - name: Save report to EVIDENCE
        if: always()
        run: |
          mkdir -p EVIDENCE/P10
          cp results.json EVIDENCE/P10/gitleaks.json || echo "No Gitleaks report generated"

  summary:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs: [semgrep, gitleaks]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Semgrep SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: semgrep-sarif
          path: ./artifacts

      - name: Download Gitleaks Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gitleaks-report
          path: ./artifacts

      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: sast-summary
          path: EVIDENCE/P10/
          retention-days: 30