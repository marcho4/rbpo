rules:
  - id: sql-injection-risk
    pattern-either:
      - pattern: |
          $DB.execute($QUERY)
      - pattern: |
          $DB.query($MODEL).filter($EXPR)
    message: Potential SQL injection vulnerability. Use parameterized queries.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"

  - id: hardcoded-secret
    pattern-either:
      - pattern: |
          SECRET_KEY = "..."
      - pattern: |
          PASSWORD = "..."
      - pattern: |
          API_KEY = "..."
      - pattern: |
          TOKEN = "..."
    message: Hardcoded secret detected. Use environment variables instead.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798"
      owasp: "A07:2021 - Identification and Authentication Failures"

  - id: weak-hash-algorithm
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: Weak cryptographic hash function. Use SHA-256 or stronger.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-327"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: debug-mode-enabled
    pattern-either:
      - pattern: |
          debug=True
      - pattern: |
          DEBUG = True
    message: Debug mode should not be enabled in production.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-489"

  - id: insecure-random
    pattern: random.$FUNC(...)
    message: Use secrets module for cryptographic randomness instead of random.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-338"

  - id: command-injection
    pattern-either:
      - pattern: os.system($CMD)
      - pattern: subprocess.call($CMD, shell=True)
      - pattern: subprocess.run($CMD, shell=True)
    message: Potential command injection. Avoid shell=True and validate input.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78"
      owasp: "A03:2021 - Injection"

  - id: path-traversal
    pattern-either:
      - pattern: open($PATH, ...)
      - pattern: os.path.join($BASE, $USER_INPUT)
    message: Potential path traversal vulnerability. Validate and sanitize file paths.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-22"
      owasp: "A01:2021 - Broken Access Control"

  - id: jwt-decode-without-verify
    pattern: jwt.decode($TOKEN, ..., verify=False, ...)
    message: JWT token decoded without verification. Always verify signatures.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-347"

  - id: insecure-pickle
    pattern-either:
      - pattern: pickle.loads($DATA)
      - pattern: pickle.load($FILE)
    message: Insecure deserialization with pickle. Use safer alternatives like JSON.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  - id: missing-authentication-check
    pattern: |
      @app.$METHOD($PATH)
      def $FUNC(...):
        ...
    message: Endpoint may be missing authentication. Verify access controls.
    languages: [python]
    severity: INFO
    metadata:
      category: security
      cwe: "CWE-306"
      owasp: "A07:2021 - Identification and Authentication Failures"

  - id: sqlalchemy-raw-sql
    pattern-either:
      - pattern: $SESSION.execute(text($SQL))
      - pattern: $ENGINE.execute($SQL)
    message: Raw SQL execution detected. Use ORM methods or parameterized queries.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-89"

  - id: logging-sensitive-data
    pattern-either:
      - pattern: |
          logging.$LEVEL(..., password=..., ...)
      - pattern: |
          logging.$LEVEL(..., token=..., ...)
      - pattern: |
          logging.$LEVEL(..., secret=..., ...)
    message: Potential logging of sensitive data. Avoid logging passwords, tokens, or secrets.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-532"

  - id: cors-allow-all
    pattern-either:
      - pattern: |
          allow_origins=["*"]
      - pattern: |
          Access-Control-Allow-Origin: *
    message: CORS configured to allow all origins. Restrict to specific domains.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-942"

  - id: unvalidated-redirect
    pattern: |
      return RedirectResponse($URL)
    message: Potential open redirect vulnerability. Validate redirect URLs.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-601"
      owasp: "A01:2021 - Broken Access Control"
